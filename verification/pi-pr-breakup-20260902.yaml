handoff_artifact: verification/pi-pr-breakup-20260902.yaml
contract:
  intended_outcomes:
    - "PR A is a Pi-led native routing, Grok/shared classification, config-directory, backup-migration, and capability fix based on current origin/main."
    - "PR B adds the Pi MLflow OSS provider, SSE repair, lifecycle hardening, and the E-dependent Pi capability/supplemental parity it consumes."
    - "PR C isolates Claude discovery hardening."
    - "PR D isolates OpenCode native Responses routing, including managed GPT-to-openai bucketing."
    - "PR E isolates capability-driven discovery, gateway-only fallbacks, OpenCode OSS capability consumption, and the setCacheKey live regression fix."
    - "The combined accepted source behaviour matches dev for shipped functionality, excluding documented diagnostics and internal evidence."
    - "The final local stack is A 8fc337e -> C c8e7114 -> E 763fa3e, with B 5ac7937 and D 210312e each based on E; integration is B -> 434bc3b."
  acceptance_checks:
    - "Every branch has an explicit base/dependency and contains no uv.lock, miniwiki, verification, prompt-cache, or .gitignore drift unless a dependency change is intentional."
    - "Focused tests, lint, formatting, type checks, git diff checks, and branch-specific malformed/boundary tests pass."
    - "Current origin/main baselines are compared with each changed lane; live ai-dev-tools checks are serial and use the named profile explicitly."
    - "The former OpenCode live regression has a deterministic cause, fix, and passing-after evidence."
    - "No branch is pushed and no PR, deployment, merge, or publication is performed without separate human authorisation."
  non_goals:
    - "Prompt-cache diagnostic scripts and their tests."
    - "Internal miniwiki and historical verification artefacts in upstream PR diffs."
    - "Unrelated refactors, dependency updates, Vibe changes, or live workspace mutation."
  reserved_human_decisions:
    - "Pushing branches or opening upstream PRs."
    - "Merging, releasing, deploying, or changing managed workspace configuration."
    - "Whether PR E's future-proofing value justifies its larger review surface."
