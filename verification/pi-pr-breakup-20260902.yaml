    pr_a: "origin/main -> pr/pi-core-grok"
    pr_c: "pr/pi-core-grok -> pr/claude-discovery-hardening"
    pr_e: "pr/claude-discovery-hardening -> pr/capability-discovery"
    pr_b: "pr/capability-discovery -> pr/pi-oss-sse"
    pr_d: "pr/capability-discovery -> pr/opencode-routing"
  scope_boundaries:
    pr_a: "Pi native Responses routing, shared GPT/Grok classification, config directory and collision-safe backup migration, supplemental Claude versions, and Claude thinking metadata."
    pr_b: "Pi MLflow provider, discovered OSS metadata consumption, SSE repair, catchable termination lifecycle, managed allowlists, session affinity, codex spec consumption, and supplemental-cache parity dependent on E."
    pr_c: "Malformed/partial UC pagination and Claude gateway fallback only."
    pr_d: "OpenCode databricks-openai provider, managed GPT bucketing, and provider-specific native Responses E2E coverage; no OSS discovery/spec changes."
    pr_e: "Shared capability-driven Responses/Gemini/OSS discovery, readiness filtering, context/spec persistence, gateway-only fallbacks, OpenCode OSS capability consumption, and setCacheKey false."
deterministic_plan:
  - "Fetch and record current origin/main; inspect intervening upstream changes."
  - "Build each lane in an isolated worktree with one writer and explicit exclusions."
  - "Run branch-focused unit tests, malformed-input and lifecycle tests, then ruff, format, ty, and git diff --check."
  - "Run the bounded full suite for the combined integration and adjudicate failures against a current origin/main worktree."
  - "Load Databricks core/model-serving guidance, then run authorised live ai-dev-tools checks serially with an explicit profile."
  - "Obtain independent requirements, edge-case, security/data, and regression reviews; reproduce every finding before disposition."
  - "Apply justified fixes, rerun affected checks, re-review, and record final adjudication."
  - "Preserve pre-continuation branch tips under backup refs before amending/rebasing the local stack."
  - "Keep the existing dirty PR E discovery edit until it is completed and committed; do not discard or overwrite it."
