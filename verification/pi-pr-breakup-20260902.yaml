reviewer_reports:
  - role: "requirements and intent"
    inspected: "five lane diffs, ancestry, integration diff, dev comparison, and handoff record"
    result: "Found stale evidence and inaccurate lane ownership/scope wording; confirmed clean isolated worktrees, forbidden-path exclusions, and explicit dependencies."
  - role: "edge cases"
    inspected: "Pi config migration, managed OpenCode routing, gateway readiness, focused tests"
    result: "Found three reproduced defects: legacy Pi backup collision, managed OpenCode GPT drop, and explicit NOT_READY OSS advertisement."
  - role: "security/data and regression/integration"
    inspected: "Pi/OpenCode/proxy/managed diffs, tests, ancestry and verification record"
    result: "Found managed OpenCode GPT drop and SIGTERM/SIGHUP stale-loopback risk; no material new security/data exposure."
finding_reproductions:
  - finding: "Managed OpenCode GPT/Responses allowlists were silently discarded."
    severity: medium
    reproduction: "managed_state_overrides for an OpenCode-only system.ai.gpt-5 list returned {}; managed_unservable_models returned the valid GPT id."
    disposition: "reproduced and fixed in D"
  - finding: "Catchable terminal termination could leave Pi pointed at a dead loopback proxy."
    severity: medium
    reproduction: "Launch installed a loopback URL durably, while cleanup existed only in finally and default SIGTERM/SIGHUP terminated without unwinding it."
    disposition: "reproduced by control-flow contradiction and fixed/tested in B"
  - finding: "Legacy private-Pi backup names could overwrite a user's standard Pi config on revert."
    severity: high
    reproduction: "An existing legacy backup prevented backup_existing_file from saving the standard config; restore_file then restored the unrelated legacy content."
    disposition: "reproduced and fixed/tested in A"
  - finding: "Explicit NOT_READY OSS endpoints were advertised."
    severity: medium
    reproduction: "_oss_specs_from_foundation_models returned an MLflow chat spec whose endpoint state.ready was NOT_READY."
    disposition: "reproduced and fixed/tested in E"
  - finding: "Verification record was stale and lane ownership/scope contradicted the actual diffs."
    severity: high
    reproduction: "Recorded B/C hashes were superseded, closure sections were empty, setCacheKey false was in E rather than D, and B/A/E wording understated their surfaces."
    disposition: "reproduced and corrected in this handoff"
fixes_and_re_review:
  - "A uses pi-agent-models/settings backup names and passes the legacy-collision upgrade/revert tests."
  - "B forwards SIGTERM/SIGHUP to Pi, unwinds through direct-URL restoration, restores prior signal handlers, and passes 114 focused tests."
  - "D maps codex family models to OpenCode's openai bucket; independent D re-review passed 731 tests and all static gates."
  - "E applies one shared explicit-readiness predicate across capability/spec paths; 792 tests and static gates pass."
  - "Integration reconciliation passes 735 focused tests; final static gates pass; final full-suite failures exactly match origin/main."
